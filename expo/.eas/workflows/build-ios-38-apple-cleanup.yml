name: Build and Upload iOS Apple Review Cleanup

on:
  push:
    branches: ['fix/apple-guideline-5-6-cleanup']

jobs:
  build_ios:
    name: Build iOS Apple Review Cleanup
    type: build
    params:
      platform: ios
      profile: production

  submit_testflight:
    name: Upload to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
