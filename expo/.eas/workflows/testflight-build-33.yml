name: Distribute iOS 1.0.0 (33) to TestFlight (paused)

# Trigger disabled after the one-time upload request.

jobs:
  find_build_33:
    name: Find finished iOS 1.0.0 (33)
    type: get-build
    params:
      platform: ios
      profile: production
      distribution: store
      app_identifier: app.rork.alsulaimani-athan
      app_version: "1.0.0"
      app_build_version: "33"
      wait_for_in_progress: true

  testflight_distribution:
    name: Upload build 33 to TestFlight
    needs: [find_build_33]
    type: testflight
    params:
      build_id: ${{ needs.find_build_33.outputs.build_id }}
      profile: production
      submit_beta_review: false
      wait_processing_timeout_seconds: 1800
