name: Apple Review Cleanup CI

on:
  pull_request:
    branches:
      - feature/v1.3.4-location-widget-ui
  push:
    branches:
      - fix/apple-guideline-5-6-cleanup

jobs:
  validate-expo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: TypeScript
        run: bun x tsc --noEmit

      - name: Export iOS bundle
        run: bun x expo export --platform ios --output-dir dist-ci
